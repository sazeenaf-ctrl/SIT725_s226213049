<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books Catalog</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
      color: #2c3e50;
    }

    #status {
      text-align: center;
      margin-bottom: 20px;
      color: #666;
      font-style: italic;
    }

    #booksList {
      max-width: 700px;
      margin: 0 auto;
      list-style: none;
    }

    #booksList li {
      background: #fff;
      border-left: 5px solid #2c3e50;
      border-radius: 4px;
      padding: 16px 20px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    #booksList li .title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #2c3e50;
    }

    #booksList li .author {
      font-size: 0.95rem;
      color: #555;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Books Catalog</h1>
  <p id="status">Loading books...</p>
  <ul id="booksList"></ul>

  <script>
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('booksList');

    function render(books) {
      listEl.innerHTML = '';

      if (!Array.isArray(books) || books.length === 0) {
        statusEl.textContent = 'No books found.';
        return;
      }

      statusEl.textContent = `Showing ${books.length} book(s):`;

      for (const book of books) {
        const li = document.createElement('li');

        const titleEl = document.createElement('div');
        titleEl.className = 'title';
        titleEl.textContent = book.title;

        const authorEl = document.createElement('div');
        authorEl.className = 'author';
        authorEl.textContent = `by ${book.author}`;

        li.appendChild(titleEl);
        li.appendChild(authorEl);
        listEl.appendChild(li);
      }
    }

    // On load, fetch /api/books and render title + author
    (async () => {
      try {
        const res = await fetch('/api/books');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const body = await res.json(); // { statusCode, data, message }
        render(body.data);
      } catch (err) {
        console.error('Error fetching books:', err);
        statusEl.textContent = 'Error fetching books.';
      }
    })();
  </script>
</body>
</html>
